<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta http-equiv="X-Robots-Tag" content="noindex, nofollow">
<title>Sujata Rank Tracker</title>
<style>
:root{color-scheme:light;--teal:#1CBFBB;--teal-d:#18A6A3;--teal-ink:#0E7C79;--teal-bg:#E6FAF9;--ink:#0c2a29;--ink2:#3d5655;--mut:#5f7473;--bd:#e0e9e8;--bg:#f4f7f7;--surf:#ffffff;--surf2:#f4fbfb;
--good:#166534;--good-bg:#dcfce7;--good-s:#16a34a;--warn:#92400e;--warn-bg:#fef3c7;--warn-s:#f59e0b;--bad:#991b1b;--bad-bg:#fee2e2;--bad-s:#dc2626;--neu:#5f7473;--neu-bg:#edf2f2;
--b1:#0E7C79;--b2:#1CBFBB;--b3:#b9e8e6;--gate:#020202;--gate2:#0d1414}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit}
#gate{position:fixed;inset:0;background:linear-gradient(135deg,var(--gate),#143a39);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#gate .box{background:var(--gate2);border:1px solid var(--teal);border-radius:14px;padding:32px 28px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
#gate img{height:34px;margin-bottom:16px}
#gate h2{color:#fff;font-size:18px;margin:0 0 4px;text-wrap:balance}
#gate p{color:#9fb3b2;font-size:13px;margin:0 0 16px}
#gate input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid #2a3a3a;background:var(--gate);color:#fff;font-size:15px;margin-bottom:10px}
#gate button{width:100%;padding:12px;border:none;border-radius:8px;background:var(--teal);color:#012;font-weight:700;font-size:15px;cursor:pointer}
#gate button:hover{background:var(--teal-d)}
#gerr{color:#ff8a8a;font-size:12.5px;margin-top:10px;min-height:16px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
header.top{background:linear-gradient(120deg,#020202,#143a39);color:#fff;padding:18px 22px;border-radius:0 0 14px 14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
header.top .logos{display:flex;align-items:center;gap:12px}
header.top img.ns{height:26px}
header.top img.br{height:30px;background:#fff;border-radius:6px;padding:3px 6px}
header.top .ttl{flex:1;min-width:200px}
header.top h1{font-size:19px;margin:0;font-weight:700}
header.top .sub{color:#a8ecea;font-size:12.5px;margin-top:2px}
header.top .src img{height:17px;display:block;margin-left:auto}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:2px solid var(--bd)}
.tab{background:none;border:none;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--teal-ink);border-bottom-color:var(--teal)}
.tab:focus-visible,.copy:focus-visible,#gate button:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:12px;padding:16px 18px}
.gap{display:grid;gap:14px}
.gap>*,.two>*,.tiles>*{min-width:0}
h2.sh{font-size:15px;margin:0 0 2px}
p.sn{font-size:12.5px;color:var(--mut);margin:0 0 12px}
/* verdict */
.verdict{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-radius:12px;padding:14px 18px;border:1px solid var(--bd);background:var(--surf)}
.vpill{font-weight:800;font-size:15px;padding:6px 14px;border-radius:999px;white-space:nowrap}
.v-good .vpill{background:var(--good-bg);color:var(--good)}.v-steady .vpill{background:var(--teal-bg);color:var(--teal-ink)}.v-watch .vpill{background:var(--warn-bg);color:var(--warn)}
.vline{font-size:16px;font-weight:700}
.vsub{font-size:12.5px;color:var(--mut)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media(max-width:1100px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.tiles{grid-template-columns:1fr}}
.tile .who{font-size:12.5px;font-weight:700;color:var(--teal-ink);margin-top:2px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.three>*{min-width:0}
.vol{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.vol:last-child{border-bottom:none}
.vol .ix{font-size:12px;font-weight:800;color:var(--mut)}
.vol .nm b{display:block;font-size:13.5px;line-height:1.25}.vol .nm span{font-size:11.5px;color:var(--mut)}
.vol .rk{font-weight:800;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:999px;padding:3px;background:var(--surf2);margin-bottom:6px;flex-wrap:wrap}
.seg button{border:none;background:none;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--mut);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal-ink);color:#fff}
.seg button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.pn em{display:block;font-style:normal;font-size:12px;color:var(--teal-ink);font-weight:600}
.tile .lbl{font-size:13px;font-weight:700;color:var(--ink2)}
.tile .row{display:flex;align-items:baseline;gap:10px;margin-top:2px;flex-wrap:wrap}
.tile .big{font-size:34px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .big small{font-size:14px;color:var(--mut);font-weight:600}
.tile .hint{font-size:12px;color:var(--mut);margin-top:6px}
.tile svg{display:block;width:100%;height:auto;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.c-up{background:var(--good-bg);color:var(--good)}.c-dn{background:var(--bad-bg);color:var(--bad)}.c-eq{background:var(--neu-bg);color:var(--neu)}
/* takeaways */
.tk{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:14.5px}
.tk:last-child{border-bottom:none}
.tk .ic{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.tk .kind{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);min-width:52px}
.k-win .ic{background:var(--good-bg);color:var(--good)}.k-watch .ic{background:var(--warn-bg);color:var(--warn)}.k-act .ic{background:var(--teal-bg);color:var(--teal-ink)}
/* stacked bars */
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.sbar{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surf);margin:4px 0 12px}
.sbar div{min-width:4px}
.leg{display:grid;gap:6px}
.leg .li{display:flex;align-items:center;gap:8px;font-size:13px}
.leg .sw{width:12px;height:12px;border-radius:3px;flex:none}
.leg .li b{margin-left:auto;font-variant-numeric:tabular-nums;font-size:14px}
.leg .li span.d{color:var(--mut);font-size:12px}
.note{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:8px 12px}
/* products */
.grp{margin-bottom:6px}
.grph{display:flex;align-items:baseline;gap:8px;margin:14px 0 6px}
.grph h3{font-size:14px;margin:0}
.grph span{font-size:12px;color:var(--mut)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 130px 92px 92px;grid-template-areas:"n s r c";align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--bd)}
.prow:last-child{border-bottom:none}
.pn{grid-area:n;min-width:0}.pn b{display:block;font-size:14px;line-height:1.25}.pn span{font-size:12px;color:var(--mut)}
.ps{grid-area:s}.ps svg{display:block;width:130px;height:34px}
.pr{grid-area:r;font-size:20px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.pc{grid-area:c;text-align:right}
@media(max-width:560px){.prow{grid-template-columns:1fr auto auto;grid-template-areas:"n n n" "s r c";row-gap:4px}.ps svg{width:110px}}
/* heat map */
.tscroll{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums;width:100%}
th,td{padding:6px 8px;text-align:center;white-space:nowrap;border-bottom:1px solid #edf2f2}
th{background:var(--surf2);color:#0c3a39;font-weight:700;font-size:11.5px}
td.l,th.l{text-align:left}
.hm th.l,.hm td.l{position:sticky;left:0;background:var(--surf);z-index:1;min-width:190px;box-shadow:1px 0 0 var(--bd)}
.hm th.l{background:var(--surf2)}
.hm tr.gh td{background:var(--surf2);font-weight:700;font-size:11.5px;color:var(--ink2);text-align:left;letter-spacing:.3px;text-transform:uppercase}
.hm tr.gh td.l{background:var(--surf2)}
.cell{display:inline-block;min-width:34px;padding:3px 0;border-radius:6px;font-weight:700;font-size:12px}
.h-top{background:var(--good-s);color:#fff}.h-org{background:var(--good-bg);color:var(--good)}.h-ad{background:var(--warn-bg);color:var(--warn)}.h-no{background:var(--bad-bg);color:var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px;color:var(--ink2);align-items:center}
.legend .cell{min-width:30px;text-align:center}
.st{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.st-top,.st-org{background:var(--good-bg);color:var(--good)}.st-ad{background:var(--warn-bg);color:var(--warn)}.st-no{background:var(--bad-bg);color:var(--bad)}
/* data */
.sechd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.copy{border:none;background:var(--teal);color:#012;font-weight:600;font-size:11.5px;padding:5px 11px;border-radius:6px;cursor:pointer}
.copy:hover{background:var(--teal-d)}
dl.how{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:8px 14px;margin:0;font-size:13.5px}
dl.how dt{font-weight:700;color:var(--teal-ink)}dl.how dd{margin:0;color:var(--ink2)}
@media(max-width:560px){dl.how{grid-template-columns:1fr}dl.how dd{margin-bottom:6px}}
details.more{border:1px solid var(--bd);border-radius:10px;padding:10px 14px;background:var(--surf)}
details.more summary{cursor:pointer;font-weight:700}
details.more[open] summary{margin-bottom:10px}
tr.skip td{color:var(--mut);background:#fafcfc}
.foot{text-align:center;color:var(--mut);font-size:11.5px;margin-top:20px;padding-top:12px;border-top:1px solid var(--bd)}
#err{background:var(--bad-bg);color:var(--bad);padding:12px 16px;border-radius:8px;margin:12px 0}
@media(max-width:560px){.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tab{padding:10px 10px;white-space:nowrap;font-size:13.5px}header.top{padding:14px 16px}header.top h1{font-size:17px}.tile .big{font-size:30px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>

let D=null;const DONE={};
const $=id=>document.getElementById(id);
function b64ToBytes(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0));}
async function deriveKey(p,s){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);}
async function decryptData(p){const k=await deriveKey(p,b64ToBytes(ENC_SALT));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(ENC_IV)},k,b64ToBytes(ENC_DATA));return JSON.parse(new TextDecoder().decode(pt));}
async function unlock(){const pw=$('pw').value;$('gerr').textContent='';try{D=await decryptData(pw);}catch(e){$('gerr').textContent='That password did not work. Check it and try again.';return;}
 $('gate').hidden=true;$('app').hidden=false;try{renderAll();}catch(e){console.error(e);$('p-sum').insertAdjacentHTML('afterbegin','<div id="err">Something went wrong drawing the dashboard: '+esc(String(e.message||e))+'</div>');}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function chg(d,neutral){
 if(d===null||d===undefined)return '<span class="chip c-eq">new</span>';
 if(d===0)return '<span class="chip c-eq">● same</span>';
 const cls=neutral?'c-eq':(d>0?'c-up':'c-dn');
 return '<span class="chip '+cls+'">'+(d>0?'▲ ':'▼ ')+Math.abs(d).toLocaleString('en-IN')+'</span>';}
function nf(n){return Number(n).toLocaleString('en-IN');}
/* inline SVG sparkline. rank=true: lower value drawn higher (better) */
function spark(vals,labels,o){
 o=o||{};const w=o.w||130,h=o.h||34,px=5,py=5,rank=!!o.rank,fmt=o.fmt||(v=>String(v));
 const nums=vals.filter(v=>v!=null);if(!nums.length)return '<svg viewBox="0 0 '+w+' '+h+'"></svg>';
 let lo=Math.min.apply(null,nums),hi=Math.max.apply(null,nums);if(lo===hi){lo-=1;hi+=1;}
 const n=vals.length,X=i=>px+(n>1?i*(w-2*px)/(n-1):(w-2*px)/2),Y=v=>rank?py+(v-lo)/(hi-lo)*(h-2*py):py+(hi-v)/(hi-lo)*(h-2*py);
 let d='',pen=false;vals.forEach((v,i)=>{if(v==null){pen=false;return;}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';pen=true;});
 let last=-1;vals.forEach((v,i)=>{if(v!=null)last=i;});
 const endc=o.endColor||'#0E7C79';
 let s='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(o.aria||'trend')+'">';
 s+='<line x1="'+px+'" x2="'+(w-px)+'" y1="'+(h-1)+'" y2="'+(h-1)+'" stroke="#e3ebea" stroke-width="1"/>';
 s+='<path d="'+d+'" fill="none" stroke="#0E7C79" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
 vals.forEach((v,i)=>{if(v==null)return;const isL=i===last;
  s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(isL?3.6:2)+'" fill="'+(isL?endc:'#0E7C79')+'" stroke="#fff" stroke-width="'+(isL?1.5:0)+'"><title>'+esc(labels[i])+': '+esc(fmt(v))+'</title></circle>';});
 return s+'</svg>';}
function copyTable(id,btn){const t=$(id);if(!t)return;const tsv=[...t.rows].map(r=>[...r.cells].map(c=>c.innerText.replace(/\s+/g,' ').trim()).join('\t')).join('\n');
 const done=()=>{btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy table',1500);};
 const fb=()=>{const r=document.createRange();r.selectNodeContents(t);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='Selected — press Ctrl+C';setTimeout(()=>btn.textContent='Copy table',2500);};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tsv).then(done,fb);}else fb();}
function showTab(t){['sum','prd','src','dat'].forEach(k=>{$('p-'+k).hidden=(k!==t);$('t-'+k).setAttribute('aria-selected',k===t?'true':'false');});
 if(!DONE[t]){DONE[t]=1;({sum:rSum,prd:rPrd,src:rSrc,dat:rDat})[t]();}}
function renderAll(){
 $('hsub').textContent='Updated '+D.meta.updated+' · checked daily on Amazon.in';

 DONE.sum=1;rSum();}

function rSum(){
 const G=D.glance,V=G.verdict;
 let h='<div class="verdict v-'+V.level+'"><span class="vpill">● '+esc(V.head)+'</span><div><div class="vline">'+esc(V.line)+'</div><div class="vsub">'+esc(V.sub)+'</div></div></div>';
 h+='<div class="tiles">'+G.tiles.map(t=>{const s=t.series,d=s.length>1?s[s.length-1]-s[s.length-2]:null;
  if(t.kind==='rank')return '<div class="card tile"><div class="lbl">'+esc(t.label)+'</div><div class="row"><span class="big">#'+nf(t.value)+'</span>'+chg(t.d)+'</div><div class="who">'+esc(t.name)+'</div>'+
   spark(s,t.labels,{w:240,h:46,rank:true,aria:t.name+' Home & Kitchen rank over time',fmt:v=>'#'+nf(v)})+'<div class="hint">'+esc(t.hint)+'</div></div>';
  return '<div class="card tile"><div class="lbl">'+esc(t.label)+'</div><div class="row"><span class="big">'+t.value+' <small>of '+t.of+'</small></span>'+chg(d,t.good==='neutral')+'</div>'+
  spark(s,t.labels,{w:240,h:46,aria:t.label+' over time',fmt:v=>v+' of '+t.of})+'<div class="hint">'+esc(t.hint)+'</div></div>';}).join('')+'</div>';
 const ic={win:'✓',watch:'!',act:'→'},kn={win:'Win',watch:'Watch',act:'Action'};
 h+='<div class="card"><h2 class="sh">Today\'s 3 takeaways</h2>'+G.takeaways.map(t=>'<div class="tk k-'+t.kind+'"><span class="ic">'+ic[t.kind]+'</span><span class="kind">'+kn[t.kind]+'</span><span>'+esc(t.text)+'</span></div>').join('')+'</div>';
 const B=G.bands,S=G.search_today;
 const bar=(segs)=>'<div class="sbar">'+segs.filter(x=>x.n>0).map(x=>'<div style="flex:'+x.n+';background:'+x.c+'" title="'+esc(x.l)+': '+x.n+'"></div>').join('')+'</div>';
 const leg=(segs)=>'<div class="leg">'+segs.map(x=>'<div class="li"><span class="sw" style="background:'+x.c+'"></span>'+esc(x.l)+' <span class="d">'+esc(x.d)+'</span><b>'+x.n+'</b></div>').join('')+'</div>';
 const bs=[{l:'Leaders',d:'top 5 on their shelf',n:B.leaders,c:'var(--b1)'},{l:'Contenders',d:'rank 6–20',n:B.contenders,c:'var(--b2)'},{l:'Long tail',d:'rank 21+',n:B.tail,c:'var(--b3)'}];
 const ss=[{l:'Top 10, free',d:'',n:S.top10,c:'var(--good-s)'},{l:'Found lower, free',d:'rank 11+',n:S.found,c:'#86efac'},{l:'Only as an ad',d:'',n:S.ads_only,c:'var(--warn-s)'},{l:'Not found',d:'not on page 1',n:S.not_found,c:'#fca5a5'}];
 const vol='<div class="card"><h2 class="sh">Top 5 by sales volume</h2><p class="sn">Best Home & Kitchen rank = sells the most overall</p>'+
  G.top5_volume.map((x,i)=>'<div class="vol"><span class="ix">'+(i+1)+'</span><div class="nm"><b>'+esc(x.name)+'</b><span>Shelf #'+x.shelf+' · '+esc(x.sub)+'</span></div><span class="rk">#'+nf(x.main)+'</span>'+chg(x.d)+'</div>').join('')+'</div>';
 h+='<div class="three">'+vol+'<div class="card"><h2 class="sh">Where our '+G.n_products+' products rank on their shelf</h2><p class="sn">Rank against direct rivals on each product\'s own shelf</p>'+bar(bs)+leg(bs)+'</div>'+
    '<div class="card"><h2 class="sh">How shoppers find us in search</h2><p class="sn">'+G.n_keywords+' searches, page 1 of Amazon, latest scan</p>'+bar(ss)+leg(ss)+'</div></div>';
 if(G.loc_note)h+='<div class="note">'+esc(G.loc_note)+'</div>';
 $('p-sum').innerHTML=h;}
/* ---------- Products ---------- */
let pMode='shelf';
function setMode(m){pMode=m;rPrd();}
function rPrd(){
 const B=D.bsr,dept=pMode==='dept';
 const groups=dept?[['d1','Top 1,000 in Home & Kitchen','biggest sellers'],['d2','1,001–10,000','steady sellers'],['d3','Beyond 10,000','smaller sellers']]
                  :[['leader','Leaders','top 5 on their shelf'],['contender','Contenders','rank 6–20'],['tail','Long tail','rank 21 and below']];
 let h='<div class="card"><h2 class="sh">Sales rank by product</h2>'+
  '<div class="seg" role="group" aria-label="Choose rank type"><button type="button" aria-pressed="'+(!dept)+'" onclick="setMode(\'shelf\')">Shelf rank</button><button type="button" aria-pressed="'+dept+'" onclick="setMode(\'dept\')">Home &amp; Kitchen rank</button></div>'+
  '<p class="sn">'+(dept?'Rank across all of Amazon\'s Home & Kitchen department, which shows how much each product sells overall.':'Rank against direct rivals on the product\'s own shelf. #1 = best seller on that shelf.')+' Lower is better. ▲ = climbed since the last check.</p>';
 const key=dept?'dept_band':'band';
 const list0=B.products.slice().sort((a,b)=>dept?a.main_latest-b.main_latest:a.latest-b.latest);
 groups.forEach(g=>{const list=list0.filter(p=>p[key]===g[0]);if(!list.length)return;
  h+='<div class="grp"><div class="grph"><h3>'+g[1]+'</h3><span>'+g[2]+' · '+list.length+'</span></div>'+list.map(p=>{
   const d=dept?p.d_prev_main:p.d_prev,series=dept?p.main_ranks:p.ranks,cur=dept?p.main_latest:p.latest;
   const endc=d>0?'#16a34a':(d<0?'#dc2626':'#0E7C79');
   const other=dept?('Shelf #'+p.latest+' · '+esc(p.sub)):('Home & Kitchen #'+nf(p.main_latest));
   return '<div class="prow"><div class="pn"><b>'+esc(p.name)+'</b>'+(dept?'':'<span>'+esc(p.sub)+'</span>')+'<em>'+other+'</em></div><div class="ps">'+
    spark(series,B.labels,{rank:true,endColor:endc,aria:p.name+(dept?' Home & Kitchen':' shelf')+' rank trend',fmt:v=>'#'+nf(v)})+'</div><div class="pr">#'+nf(cur)+'</div><div class="pc">'+chg(d)+'</div></div>';}).join('')+'</div>';});
 $('p-prd').innerHTML=h+'</div>';}
/* ---------- Search ---------- */
function cellOf(o,p){if(o!=null)return '<span class="cell '+(o<=10?'h-top':'h-org')+'">'+o+'</span>';if(p!=null)return '<span class="cell h-ad">Ad</span>';return '<span class="cell h-no">—</span>';}
function stOf(k){const o=k.latest,p=k.paid[k.paid.length-1];if(o!=null)return '<span class="st '+(o<=10?'st-top':'st-org')+'">Free #'+o+'</span>';if(p!=null)return '<span class="st st-ad">Ad only</span>';return '<span class="st st-no">Not found</span>';}
function rSrc(){
 const W=D.kw;
 let h='<div class="card"><h2 class="sh">Search visibility map</h2><p class="sn">Each box shows where Sujata appeared on page 1 of Amazon search that day.</p>'+
  '<div class="legend"><span><span class="cell h-top">4</span> Top 10, free</span><span><span class="cell h-org">14</span> Found lower, free</span><span><span class="cell h-ad">Ad</span> Only as an ad</span><span><span class="cell h-no">—</span> Not found</span></div>';
 if(D.glance.loc_note)h+='<div class="note" style="margin-bottom:10px">'+esc(D.glance.loc_note)+'</div>';
 h+='<div class="tscroll"><table class="hm"><thead><tr><th class="l">Search term</th>'+W.labels.map((l,i)=>'<th title="'+esc(W.footprint[i].loc)+'">'+esc(l)+'</th>').join('')+'<th>Today</th></tr></thead><tbody>';
 W.groups.forEach(g=>{const ks=W.keywords.filter(k=>k.group===g);if(!ks.length)return;
  h+='<tr class="gh"><td class="l">'+esc(g)+'</td><td colspan="'+(W.labels.length+1)+'"></td></tr>';
  ks.forEach(k=>{h+='<tr><td class="l">'+esc(k.kw)+'</td>'+k.organic.map((o,i)=>'<td>'+cellOf(o,k.paid[i])+'</td>').join('')+'<td>'+stOf(k)+'</td></tr>';});});
 $('p-src').innerHTML=h+'</tbody></table></div></div>';}
/* ---------- Data ---------- */
function secHead(title,note,tid){return '<div class="sechd"><div><h2 class="sh">'+esc(title)+'</h2>'+(note?'<p class="sn">'+esc(note)+'</p>':'')+'</div>'+(tid?'<button type="button" class="copy" onclick="copyTable(\''+tid+'\',this)">Copy table</button>':'')+'</div>';}
function rDat(){
 const B=D.bsr,W=D.kw,L=D.scanlog;
 let h='<div class="card"><h2 class="sh">How to read this</h2><dl class="how">'+D.how.map(x=>'<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>').join('')+'</dl></div>';
 h+='<div class="card">'+secHead('Scan log','Every scan, newest first. Skipped runs read no pages.','tLog')+'<div class="tscroll"><table id="tLog"><thead><tr><th class="l">Date</th><th>Time (IST)</th><th class="l">Scan</th><th>Rows</th><th class="l">Status</th></tr></thead><tbody>'+
  L.map(r=>'<tr'+(r.skipped?' class="skip"':'')+'><td class="l">'+esc(r.date)+'</td><td>'+esc(r.time)+'</td><td class="l">'+esc(r.type)+'</td><td>'+(r.rows==null?'—':r.rows)+'</td><td class="l">'+esc(r.how)+'</td></tr>').join('')+'</tbody></table></div></div>';
 h+='<details class="more"><summary>Shelf rank table</summary>'+secHead('Shelf rank by day','','tBsr')+'<div class="tscroll"><table id="tBsr"><thead><tr><th class="l">Product</th><th class="l">Shelf</th>'+B.labels.map(l=>'<th>'+esc(l)+'</th>').join('')+'<th>Change</th></tr></thead><tbody>'+
  B.products.map(p=>'<tr><td class="l">'+esc(p.name)+'</td><td class="l">'+esc(p.sub)+'</td>'+p.ranks.map(v=>'<td>'+(v==null?'—':v)+'</td>').join('')+'<td>'+(p.d_prev==null?'—':(p.d_prev>0?'+':'')+p.d_prev)+'</td></tr>').join('')+'</tbody></table></div></details>';
 h+='<details class="more"><summary>Home &amp; Kitchen rank table</summary>'+secHead('Home & Kitchen rank by day','','tDept')+'<div class="tscroll"><table id="tDept"><thead><tr><th class="l">Product</th>'+B.labels.map(l=>'<th>'+esc(l)+'</th>').join('')+'<th>Change</th></tr></thead><tbody>'+
  B.products.slice().sort((a,b)=>a.main_latest-b.main_latest).map(p=>'<tr><td class="l">'+esc(p.name)+'</td>'+p.main_ranks.map(v=>'<td>'+(v==null?'—':nf(v))+'</td>').join('')+'<td>'+(p.d_prev_main==null?'—':(p.d_prev_main>0?'+':'')+nf(p.d_prev_main))+'</td></tr>').join('')+'</tbody></table></div></details>';
 h+='<details class="more"><summary>Full search rank table</summary>'+secHead('Search rank by day','Number = rank without ads. "Ad" = only a paid slot. "—" = not on page 1.','tKw')+'<div class="tscroll"><table id="tKw"><thead><tr><th class="l">Search term</th><th class="l">Group</th>'+W.labels.map(l=>'<th>'+esc(l)+'</th>').join('')+'</tr></thead><tbody>'+
  W.keywords.map(k=>'<tr><td class="l">'+esc(k.kw)+'</td><td class="l">'+esc(k.group)+'</td>'+k.organic.map((o,i)=>'<td>'+(o!=null?o:(k.paid[i]!=null?'Ad':'—'))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></details>';
 $('p-dat').innerHTML=h;}
</script>

</body></html>
