<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta http-equiv="X-Robots-Tag" content="noindex, nofollow">
<title>Sujata Rank Tracker</title>
<style>
:root{color-scheme:light;--teal:#1CBFBB;--teal-d:#18A6A3;--teal-ink:#0E7C79;--teal-bg:#E6FAF9;--ink:#0c2a29;--ink2:#3d5655;--mut:#667a79;--bd:#e0e9e8;--bg:#f5f8f8;--surf:#ffffff;--surf2:#f4fbfb;--ok:#15803d;--ok-bg:#e7f8e9;--warn:#a16207;--warn-bg:#fef3c7;--bad:#b91c1c;--bad-bg:#fde8e8;--amz:#FF9900;--gate:#020202;--gate2:#0d1414}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
button{font:inherit}
#gate{position:fixed;inset:0;background:linear-gradient(135deg,var(--gate),#143a39);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#gate .box{background:var(--gate2);border:1px solid var(--teal);border-radius:14px;padding:32px 28px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
#gate img{height:34px;margin-bottom:16px}
#gate h2{color:#fff;font-size:18px;margin:0 0 4px;text-wrap:balance}
#gate p{color:#9fb3b2;font-size:13px;margin:0 0 16px}
#gate input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid #2a3a3a;background:var(--gate);color:#fff;font-size:15px;margin-bottom:10px}
#gate button{width:100%;padding:12px;border:none;border-radius:8px;background:var(--teal);color:#012;font-weight:700;font-size:15px;cursor:pointer}
#gate button:hover{background:var(--teal-d)}
#gerr{color:#ff8a8a;font-size:12.5px;margin-top:10px;min-height:16px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{background:linear-gradient(120deg,#020202,#143a39);color:#fff;padding:20px 24px;border-radius:0 0 14px 14px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px}
header.top .logos{display:flex;align-items:center;gap:12px}
header.top img.ns{height:28px}
header.top img.br{height:32px;background:#fff;border-radius:6px;padding:3px 6px}
header.top .ttl{flex:1;min-width:220px}
header.top h1{font-size:20px;margin:0;font-weight:700;text-wrap:balance}
header.top .sub{color:#a8ecea;font-size:12.5px;margin-top:3px}
header.top .src{font-size:12px;color:#c7efee;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
header.top .src img{height:18px}
.banner{background:linear-gradient(110deg,var(--teal-bg),var(--surf));border-left:5px solid var(--teal);border-radius:10px;padding:14px 18px;margin-bottom:16px;font-size:14.5px;color:#0c3a39}
.banner b{color:var(--teal-ink)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:2px solid var(--bd)}
.tab{background:none;border:none;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--teal-ink);border-bottom-color:var(--teal)}
.tab:focus-visible,.chip:focus-visible,.copy:focus-visible,#gate button:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.kpi .lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.kpi .val{font-size:24px;font-weight:700;margin-top:4px;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi .val small{font-size:13px;color:var(--mut);font-weight:600}
.kpi .foot{font-size:11.5px;color:var(--mut);margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.sec{background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.sec h3{font-size:15px;margin:0 0 2px;color:var(--ink)}
.sec .note{font-size:12px;color:var(--mut);margin:0 0 12px}
.ins{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13.5px}
.ins:last-child{border-bottom:none}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.2px}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--teal-bg);color:var(--teal-ink)}.p-mut{background:#eef2f2;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--bd);background:var(--surf);color:var(--ink2);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--teal-ink);border-color:var(--teal-ink);color:#fff}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mc{background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:12px 14px 10px;display:flex;flex-direction:column;gap:4px}
.mc .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mc .nm{font-weight:700;font-size:13.5px;line-height:1.3}
.mc .sc{font-size:11.5px;color:var(--mut)}
.mc .rk{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.mc .rk b{font-size:24px;font-variant-numeric:tabular-nums}
.mc .ch{position:relative;height:96px;margin-top:2px}
.mc .empty{height:96px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12.5px;color:var(--mut);background:var(--surf2);border-radius:8px;padding:8px}
.mc .ft{font-size:11px;color:var(--mut)}
.dl{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--ok)}.dn{color:var(--bad)}.fl{color:var(--mut)}
.tscroll{overflow-x:auto;border:1px solid var(--bd);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;text-align:center;border-bottom:1px solid #edf2f2;white-space:nowrap}
th{background:var(--surf2);color:#0c3a39;font-weight:700;font-size:11.5px}
td.l,th.l{text-align:left}
td.na{color:#a3b3b2}
tr.skip td{background:#fafcfc;color:var(--mut)}
.sechd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.copy{border:none;background:var(--teal);color:#012;font-weight:600;font-size:11.5px;padding:5px 11px;border-radius:6px;cursor:pointer}
.copy:hover{background:var(--teal-d)}
details.gloss{background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:12px 16px;margin-bottom:16px}
details.gloss summary{cursor:pointer;font-weight:700;font-size:14px}
details.gloss dl{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 14px;margin:12px 0 0;font-size:13px}
details.gloss dt{font-weight:700;color:var(--teal-ink)}
details.gloss dd{margin:0;color:var(--ink2)}
@media(max-width:560px){details.gloss dl{grid-template-columns:1fr}header.top{padding:16px}header.top h1{font-size:17px}header.top .src{align-items:flex-start;text-align:left}}
.foot{text-align:center;color:var(--mut);font-size:11.5px;margin-top:22px;padding-top:12px;border-top:1px solid var(--bd)}
.foot img{height:15px;vertical-align:middle;margin-left:4px;background:#0c2a29;border-radius:3px;padding:2px 4px}
#err{background:var(--bad-bg);color:var(--bad);padding:12px 16px;border-radius:8px;margin:16px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>

let D=null;const CH={};const DONE={};
const $=id=>document.getElementById(id);
function b64ToBytes(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0));}
async function deriveKey(p,s){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);}
async function decryptData(p){const k=await deriveKey(p,b64ToBytes(ENC_SALT));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(ENC_IV)},k,b64ToBytes(ENC_DATA));return JSON.parse(new TextDecoder().decode(pt));}
async function unlock(){const pw=$('pw').value;$('gerr').textContent='';try{D=await decryptData(pw);}catch(e){$('gerr').textContent='That password did not work. Check it and try again.';return;}
 $('gate').hidden=true;$('app').hidden=false;try{renderAll();}catch(e){console.error(e);$('p-sum').insertAdjacentHTML('afterbegin','<div id="err">Something went wrong drawing the dashboard: '+esc(String(e.message||e))+'</div>');}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function dlt(d,inv){ // d = places improved (positive = better)
 if(d===null||d===undefined)return '<span class="dl fl">—</span>';
 if(d>0)return '<span class="dl up">▲ '+d+'</span>';if(d<0)return '<span class="dl dn">▼ '+Math.abs(d)+'</span>';return '<span class="dl fl">● 0</span>';}
function pill(kind,txt){return '<span class="pill p-'+kind+'">'+esc(txt)+'</span>';}
function rk(v){return v==null?'—':'#'+v;}
function copyTable(id,btn){const t=$(id);if(!t)return;const tsv=[...t.rows].map(r=>[...r.cells].map(c=>c.innerText.replace(/\s+/g,' ').trim()).join('\t')).join('\n');
 const done=()=>{const o=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=o,1500);};
 const fallback=()=>{const r=document.createRange();r.selectNodeContents(t);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='Selected — press Ctrl+C';setTimeout(()=>btn.textContent='Copy table',2500);};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tsv).then(done,fallback);}else fallback();}
function secHead(title,note,tableId){return '<div class="sechd"><div><h3>'+esc(title)+'</h3>'+(note?'<p class="note">'+note+'</p>':'')+'</div>'+(tableId?'<button type="button" class="copy" onclick="copyTable(\''+tableId+'\',this)">Copy table</button>':'')+'</div>';}
function showTab(t){['sum','bsr','kw','log'].forEach(k=>{$('p-'+k).hidden=(k!==t);$('t-'+k).setAttribute('aria-selected',k===t?'true':'false');});
 if(!DONE[t]){DONE[t]=1;({sum:rSum,bsr:rBsr,kw:rKw,log:rLog})[t]();}}
function renderAll(){
 $('hsub').innerHTML='Latest BSR check: <b>'+esc(D.bsr.latest)+'</b> · Latest keyword scan: <b>'+esc(D.kw.latest)+'</b>';
 $('hsrc').textContent='Amazon India · '+D.kw.location;
 $('banner').innerHTML=D.insights.headline;
 $('foot').innerHTML='Confidential — prepared by NorthSide for Sujata · Amazon India · Refreshed automatically after every scan · Built '+esc(D.meta.generated)+' <img src="'+document.querySelector('header.top img.ns').src+'" alt="NorthSide">';
 DONE.sum=1;rSum();
}

const INK2='#3d5655',GRID='#e6eeed',LINE='#0E7C79',LAST='#063f3d';
function spark(canvasId,labels,vals){
 if(CH[canvasId]){CH[canvasId].destroy();}
 const nums=vals.filter(v=>v!=null);if(!nums.length)return;
 let lo=Math.min(...nums),hi=Math.max(...nums);const pad=Math.max(1,Math.round((hi-lo)*0.25));
 lo=Math.max(1,lo-pad);hi=hi+pad;
 let lastIdx=-1;vals.forEach((v,i)=>{if(v!=null)lastIdx=i;});
 CH[canvasId]=new Chart($(canvasId),{type:'line',data:{labels:labels,datasets:[{data:vals,borderColor:LINE,borderWidth:2,tension:0,spanGaps:false,
   pointRadius:vals.map((v,i)=>i===lastIdx?5:3),pointHoverRadius:6,pointBackgroundColor:vals.map((v,i)=>i===lastIdx?LAST:LINE),pointBorderColor:'#fff',pointBorderWidth:vals.map((v,i)=>i===lastIdx?2:1)}]},
  options:{maintainAspectRatio:false,animation:false,layout:{padding:{top:4,right:6,bottom:0,left:0}},
   plugins:{legend:{display:false},tooltip:{displayColors:false,callbacks:{title:c=>c[0].label,label:c=>c.parsed.y==null?'Not on page 1':'Rank #'+c.parsed.y}}},
   interaction:{mode:'index',intersect:false},
   scales:{x:{grid:{display:false},ticks:{color:INK2,font:{size:10},maxRotation:0,autoSkip:true,maxTicksLimit:7}},
    y:{reverse:true,min:lo,max:hi,grid:{color:GRID},border:{display:false},ticks:{color:INK2,font:{size:10},maxTicksLimit:4,precision:0,callback:v=>Number.isInteger(v)?'#'+v:''}}}}});
}
/* ---------- Summary ---------- */
function rSum(){
 const K=D.kpis;
 const kp=(l,v,f)=>'<div class="kpi"><div class="lbl">'+l+'</div><div class="val">'+v+'</div><div class="foot">'+f+'</div></div>';
 let h='<div class="kpis">'+
  kp('Products in top 5 of sub-category',K.top5+' <small>of '+K.n_products+'</small>',dlt(K.top5_d)+' vs previous check')+
  kp('Products improved since last check',K.improved+' <small>of '+K.n_products+'</small>',K.held+' held · '+K.eased+' eased')+
  kp('#1 positions',K.num1,esc(K.num1_names||'—'))+
  kp('Keywords earning organic page 1',K.kw_org+' <small>of '+K.n_kw+'</small>',dlt(K.kw_org_d)+' vs previous scan')+
  kp('Keywords in organic top 10',K.kw_top10,dlt(K.kw_top10_d)+' vs previous scan')+
  kp('Keywords visible through ads only',K.kw_paid_only,'Opportunity to earn organically')+
  '</div>';
 const kmap={win:['ok','Win'],hold:['info','Holding'],watch:['warn','Watch'],opp:['mut','Opportunity']};
 const block=(title,note,items)=>'<div class="sec">'+secHead(title,note)+(items.length?items.map(i=>'<div class="ins">'+pill(kmap[i.kind][0],kmap[i.kind][1])+'<div>'+i.text+'</div></div>').join(''):'<p class="note">No notable movement this time.</p>')+'</div>';
 h+='<div class="two">'+block('Best Sellers Rank — what moved','Latest check '+esc(D.bsr.latest)+' compared with '+esc(D.bsr.previous),D.insights.bsr)+
    block('Keyword rank — what moved','Latest scan '+esc(D.kw.latest)+' compared with '+esc(D.kw.previous),D.insights.kw)+'</div>';
 // footprint table
 const F=D.kw.footprint;
 h+='<div class="sec">'+secHead('Page-1 search footprint by scan','How many of the '+K.n_kw+' tracked keywords show Sujata on page 1. Search results depend on the delivery location Amazon assigns to the session, shown in the first row.','tFoot')+
  '<div class="tscroll"><table id="tFoot"><thead><tr><th class="l">Measure</th>'+F.map(f=>'<th>'+esc(f.label)+'</th>').join('')+'</tr></thead><tbody>'+
  [['Delivery location Amazon served','loc'],['Earning organic page 1','organic'],['…of which organic top 10','top10'],['Visible through ads','paid'],['Visible through ads only','paid_only'],['Not on page 1','absent']]
   .map(([n,k])=>'<tr><td class="l">'+n+'</td>'+F.map(f=>'<td>'+f[k]+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div>';
 h+='<details class="gloss"><summary>How to read this dashboard</summary><dl>'+
  D.glossary.map(g=>'<dt>'+esc(g[0])+'</dt><dd>'+esc(g[1])+'</dd>').join('')+'</dl></details>';
 $('p-sum').innerHTML=h;
}
/* ---------- BSR ---------- */
let bsrBand='all';
function bandOf(r){return r<=20?'top':(r<=100?'mid':'tail');}
function rBsr(){
 const B=D.bsr;
 const chips=[['all','All '+B.products.length],['top','Top 20'],['mid','21–100'],['tail','100+']];
 let h='<div class="sec">'+secHead('Sub-category rank over time','One reading per day (the latest check of that day). Lower is better — #1 is the best-selling product in its sub-category. Filter by where each product ranks today.')+
  '<div class="chips" role="group" aria-label="Filter products by current rank">'+chips.map(c=>'<button type="button" class="chip" aria-pressed="'+(c[0]===bsrBand)+'" onclick="setBand(\''+c[0]+'\')">'+c[1]+'</button>').join('')+'</div>'+
  '<div class="mgrid" id="bsrGrid"></div></div>';
 h+='<div class="sec">'+secHead('All readings','Sub-category rank by day, best first. ▲ = climbed, ▼ = eased (places).','tBsr')+'<div class="tscroll"><table id="tBsr"><thead><tr><th class="l">Product</th><th class="l">Sub-category</th>'+
  B.labels.map(l=>'<th>'+esc(l)+'</th>').join('')+'<th>vs last check</th><th>Since tracking began</th><th>Main category (latest)</th></tr></thead><tbody>'+
  B.products.map(p=>'<tr><td class="l"><b>'+esc(p.name)+'</b></td><td class="l">'+esc(p.sub)+'</td>'+p.ranks.map(v=>v==null?'<td class="na">—</td>':'<td>'+v+'</td>').join('')+
   '<td>'+dlt(p.d_prev)+'</td><td>'+dlt(p.d_start)+'</td><td>#'+p.main_latest.toLocaleString('en-IN')+'</td></tr>').join('')+'</tbody></table></div></div>';
 $('p-bsr').innerHTML=h;drawBsr();
}
function setBand(b){bsrBand=b;document.querySelectorAll('#p-bsr .chip').forEach((c,i)=>c.setAttribute('aria-pressed',String(['all','top','mid','tail'][i]===b)));drawBsr();}
function trendPill(p){if(p.watch)return pill('warn','Watch');if(p.d_prev>0)return pill('ok','Climbing');if(p.d_prev<0)return pill('mut','Eased');return pill('info','Holding');}
function drawBsr(){
 const B=D.bsr;Object.keys(CH).filter(k=>k.startsWith('b_')).forEach(k=>{CH[k].destroy();delete CH[k];});
 const list=B.products.filter(p=>bsrBand==='all'||bandOf(p.latest)===bsrBand);
 $('bsrGrid').innerHTML=list.length?list.map(p=>'<div class="mc"><div class="hd"><div><div class="nm">'+esc(p.name)+'</div><div class="sc">'+esc(p.sub)+'</div></div>'+trendPill(p)+'</div>'+
  '<div class="rk"><b>#'+p.latest+'</b>'+dlt(p.d_prev)+'<span class="ft">vs last check</span></div><div class="ch"><canvas id="b_'+p.id+'" role="img" aria-label="'+esc(p.name)+' rank trend"></canvas></div>'+
  '<div class="ft">'+esc(B.labels[0])+': #'+(p.ranks.find(v=>v!=null))+' → '+esc(B.labels[B.labels.length-1])+': #'+p.latest+'</div></div>').join(''):'<p class="note">No products in this band today.</p>';
 list.forEach(p=>spark('b_'+p.id,B.labels,p.ranks));
}
/* ---------- Keywords ---------- */
let kwGroup='All';
function kwStatus(k){if(k.status==='organic')return pill('ok','Earning page 1');if(k.status==='paid_only')return pill('warn','Ads only');return pill('bad','Not on page 1');}
function rKw(){
 const W=D.kw;const groups=['All'].concat(W.groups);
 let h='<div class="sec">'+secHead('Organic rank over time','Position among unpaid results on page 1 of Amazon search. Lower is better. A gap means Sujata had no organic listing on page 1 that day.')+
  '<div class="chips" role="group" aria-label="Filter keywords by product group">'+groups.map(g=>'<button type="button" class="chip" aria-pressed="'+(g===kwGroup)+'" onclick="setKw(\''+esc(g)+'\')">'+esc(g)+'</button>').join('')+'</div>'+
  '<div class="mgrid" id="kwGrid"></div></div>';
 h+='<div class="sec">'+secHead('All scans','Organic rank by scan. "Ad #n" means Sujata showed only through a Sponsored slot that day. Paid slots move with every page load, so read them as a spot-check, not a trend.','tKw')+
  '<div class="tscroll"><table id="tKw"><thead><tr><th class="l">Keyword</th><th class="l">Group</th>'+W.labels.map(l=>'<th>'+esc(l)+'</th>').join('')+'<th>vs last scan</th><th>Status today</th></tr></thead><tbody>'+
  W.keywords.map(k=>'<tr><td class="l"><b>'+esc(k.kw)+'</b></td><td class="l">'+esc(k.group)+'</td>'+k.organic.map((v,i)=>v!=null?'<td>'+v+'</td>':(k.paid[i]!=null?'<td class="na">Ad #'+k.paid[i]+'</td>':'<td class="na">—</td>')).join('')+
   '<td>'+dlt(k.d_prev)+'</td><td>'+kwStatus(k)+'</td></tr>').join('')+'</tbody></table></div></div>';
 $('p-kw').innerHTML=h;drawKw();
}
function setKw(g){kwGroup=g;document.querySelectorAll('#p-kw .chip').forEach(c=>c.setAttribute('aria-pressed',String(c.textContent===g)));drawKw();}
function drawKw(){
 const W=D.kw;Object.keys(CH).filter(k=>k.startsWith('k_')).forEach(k=>{CH[k].destroy();delete CH[k];});
 const list=W.keywords.filter(k=>kwGroup==='All'||k.group===kwGroup);
 $('kwGrid').innerHTML=list.map((k,i)=>{const has=k.organic.some(v=>v!=null);const lastP=k.paid[k.paid.length-1];
  return '<div class="mc"><div class="hd"><div><div class="nm">'+esc(k.kw)+'</div><div class="sc">'+esc(k.group)+(k.models?' · '+esc(k.models):'')+'</div></div>'+kwStatus(k)+'</div>'+
  '<div class="rk"><b>'+rk(k.latest)+'</b>'+(k.latest!=null?dlt(k.d_prev)+'<span class="ft">organic, vs last scan</span>':'<span class="ft">no organic listing today</span>')+'</div>'+
  (has?'<div class="ch"><canvas id="k_'+k.idx+'" role="img" aria-label="'+esc(k.kw)+' organic rank trend"></canvas></div>':
   '<div class="empty">'+(k.status==='paid_only'?'Visible through ads only'+(lastP!=null?' — Sponsored slot #'+lastP+' today':'')+'. No organic page-1 listing in any scan yet.':'Not on page 1 today, and no organic listing in any scan yet — an activation opportunity.')+'</div>')+
  '<div class="ft">'+(lastP!=null?'Sponsored slot today: #'+lastP:'No Sponsored slot today')+'</div></div>';}).join('');
 list.forEach(k=>{if(k.organic.some(v=>v!=null))spark('k_'+k.idx,W.labels,k.organic);});
}
/* ---------- Scan log ---------- */
function rLog(){
 const L=D.scanlog;
 let h='<div class="sec">'+secHead('Every scan, newest first','Completed scans come straight from the data archive. Skipped runs come from the run logs.','tLog')+
 '<div class="tscroll"><table id="tLog"><thead><tr><th class="l">Date</th><th>Time (IST)</th><th class="l">Scan</th><th>Rows saved</th><th class="l">How it ran</th></tr></thead><tbody>'+
 L.map(r=>'<tr'+(r.skipped?' class="skip"':'')+'><td class="l">'+esc(r.date)+'</td><td>'+esc(r.time)+'</td><td class="l">'+esc(r.type)+'</td><td>'+(r.rows==null?'—':r.rows)+'</td><td class="l">'+(r.skipped?pill('mut','Skipped')+' ':'')+esc(r.how)+'</td></tr>').join('')+
 '</tbody></table></div></div>';
 $('p-log').innerHTML=h;
}
</script>

</body></html>
