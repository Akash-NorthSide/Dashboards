<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta http-equiv="X-Robots-Tag" content="noindex, nofollow">
<title>Sujata — Amazon Performance Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--teal:#1CBFBB;--teal-d:#18A6A3;--teal-bg:#E6FAF9;--dark:#1a1a1a;--mut:#7D7D7D;--amz:#FF9900;--ok:#15803d;--warn:#d97706;--bad:#dc2626;--bd:#e6e6e6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f8f9fa;color:#1a1a1a;line-height:1.5}
#gate{position:fixed;inset:0;background:linear-gradient(135deg,#020202,#1a2a2a);display:flex;align-items:center;justify-content:center;z-index:9999}
#gate .box{background:#0d1414;border:1px solid var(--teal);border-radius:14px;padding:40px;max-width:380px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#gate img{height:34px;margin-bottom:18px}#gate h2{color:#fff;font-size:18px;margin-bottom:6px}#gate p{color:var(--mut);font-size:13px;margin-bottom:18px}
#gate input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid #2a3a3a;background:#020202;color:#fff;font-size:15px;margin-bottom:12px}
#gate button{width:100%;padding:12px;border:none;border-radius:8px;background:var(--teal);color:#012;font-weight:700;font-size:15px;cursor:pointer}#gate button:hover{background:var(--teal-d)}
#gerr{color:#ff6b6b;font-size:12px;margin-top:10px;min-height:14px}
#app{display:none;max-width:1320px;margin:0 auto;padding:0 18px 60px}
header{background:linear-gradient(120deg,#020202,#143a39);color:#fff;padding:22px 26px;border-radius:0 0 14px 14px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:18px}
header .logos{display:flex;align-items:center;gap:14px}header img.ns{height:30px}header img.br{height:34px;background:#fff;border-radius:6px;padding:3px 6px}
header .ttl{flex:1;min-width:200px}header h1{font-size:20px;font-weight:700}header .sub{color:#9fe;font-size:12.5px;margin-top:3px}header .period{font-size:12px;color:#bfe;text-align:right}
.banner{background:linear-gradient(110deg,var(--teal-bg),#fff);border-left:5px solid var(--teal);border-radius:10px;padding:16px 20px;margin-bottom:18px;font-size:14.5px;color:#0c3a39}.banner b{color:var(--teal-d)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:2px solid var(--bd)}
.tab{padding:10px 16px;cursor:pointer;font-weight:600;font-size:14px;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px}.tab.active{color:var(--teal-d);border-bottom-color:var(--teal)}
.pane{display:none}.pane.active{display:block}
.grid{display:grid;gap:12px;margin-bottom:18px}.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card .lbl{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.card .val{font-size:22px;font-weight:700;margin-top:5px;color:#0c2a29}.card .sub2{font-size:11.5px;color:var(--mut);margin-top:3px}
.sec{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:18px}
.sec h3{font-size:15px;color:#0c2a29;margin-bottom:4px}.sec .note{font-size:11.5px;color:var(--mut);margin-bottom:12px}
.chwrap{position:relative;height:300px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:780px){.two{grid-template-columns:1fr}.chwrap{height:260px}}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:7px 9px;text-align:center;border-bottom:1px solid #eef1f1;white-space:nowrap}
th{background:#f4fbfb;color:#0c3a39;font-weight:700;font-size:11.5px;letter-spacing:.2px;position:sticky;top:0;z-index:3}
td.l,th.l{text-align:left}
tr.tot td{font-weight:700;background:#eaf8f7;border-top:2px solid var(--teal);position:sticky;bottom:0;z-index:2}
tr.sub td{font-weight:700;background:#f0fafa;border-top:1px solid var(--teal)}
td.mtot{background:#f0fafa;font-weight:600}
tr.projrow td{background:#fff7ed;color:#9a3412;font-style:italic}
.strat{background:linear-gradient(110deg,#fff7ed,#fff);border-left:5px solid var(--amz);border-radius:10px;padding:15px 20px;margin-bottom:18px;font-size:14px;color:#7c2d12}.strat b{color:#9a3412}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px}
.p-brand{background:#e0f2fe;color:#0369a1}.p-comp{background:#fef3c7;color:#92400e}.p-gen{background:#e7f8e9;color:#15803d}
.roas-ok{color:var(--ok);font-weight:700}.roas-wn{color:var(--warn);font-weight:700}.roas-bd{color:var(--bad);font-weight:700}
.tbl-scroll{overflow:auto;max-height:540px;position:relative}
.csv{float:right;font-size:11px;background:var(--teal);color:#012;border:none;padding:5px 11px;border-radius:6px;cursor:pointer;font-weight:600}.csv:hover{background:var(--teal-d)}
.stories4{grid-template-columns:repeat(4,minmax(0,1fr))!important}@media(max-width:900px){.stories4{grid-template-columns:repeat(2,1fr)!important}}@media(max-width:560px){.stories4{grid-template-columns:1fr!important}}
.stories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}@media(max-width:900px){.stories{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.stories{grid-template-columns:1fr}}
.story{background:linear-gradient(135deg,#fff,#f4fbfb);border:1px solid var(--bd);border-left:4px solid var(--teal);border-radius:10px;padding:14px}.story .n{font-size:11px;color:var(--teal-d);font-weight:700}.story .t{font-size:13.5px;margin-top:5px;color:#0c2a29}
.proj{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.proj .card{border-left:4px solid var(--amz)}
.foot{text-align:center;color:var(--mut);font-size:11.5px;margin-top:24px;padding-top:14px;border-top:1px solid var(--bd)}.foot img{height:16px;vertical-align:middle;opacity:.7;margin-left:5px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:4px}
.b-up{background:#e7f8e9;color:#15803d}.b-dn{background:#fde8e8;color:#dc2626}
.rec{background:#f0fafa;border:1px solid var(--bd);border-left:4px solid var(--teal);border-radius:8px;padding:10px 14px;margin-bottom:8px;font-size:13.5px}.rec b{color:var(--teal-d)}
.watch{background:#fff7ed;border-left:4px solid var(--amz);border-radius:8px;padding:10px 14px;margin-bottom:8px;font-size:13.5px;color:#7c2d12}
.tgt{background:linear-gradient(110deg,#eef2ff,#fff);border-left:5px solid #6366f1;border-radius:10px;padding:14px 18px;margin-bottom:18px;font-size:14px;color:#312e81}.tgt b{color:#4338ca}
details.gloss{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px 16px;margin-bottom:18px}details.gloss summary{cursor:pointer;font-weight:700;color:#0c2a29;font-size:14px}details.gloss table{margin-top:10px}
a:focus-visible,button:focus-visible,summary:focus-visible,.tab:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media print{#gate{display:none!important}#app{display:block!important;max-width:100%}.tabs,.csv{display:none!important}.pane{display:block!important;page-break-inside:avoid}.sec,.card{box-shadow:none;border:1px solid #ccc}header{background:#143a39!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}header{padding:16px}header h1{font-size:17px}.card .val{font-size:19px}.stories{grid-template-columns:1fr}}
</style></head><body>

let D=null;const CH={};
function b64ToBytes(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0));}
async function deriveKey(p,s){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);}
async function decryptData(p){const k=await deriveKey(p,b64ToBytes(ENC_SALT));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(ENC_IV)},k,b64ToBytes(ENC_DATA));return JSON.parse(new TextDecoder().decode(pt));}
async function unlock(){const pw=document.getElementById('pw').value;try{D=await decryptData(pw);document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';render();}catch(e){document.getElementById('gerr').textContent='Incorrect password. Please try again.';}}
function inr(n){n=Number(n)||0;const a=Math.abs(n),s=n<0?'-':'';if(a>=1e7)return s+'₹'+(a/1e7).toFixed(2)+'Cr';if(a>=1e5)return s+'₹'+(a/1e5).toFixed(2)+'L';if(a>=1e3)return s+'₹'+(a/1e3).toFixed(1)+'K';return s+'₹'+Math.round(a);}
function num(n){return (Number(n)||0).toLocaleString('en-IN');}
function rx(r){return (Number(r)||0).toFixed(2)+'x';}
function pct(n){return (Number(n)||0).toFixed(1)+'%';}
function pct2(n){return (Number(n)||0).toFixed(2)+'%';}
function rcls(r){return r>=3?'roas-ok':(r>=1?'roas-wn':'roas-bd');}
function moOf(wk){const t=''+wk;const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];for(const m of M){if(t.indexOf(m)>=0)return m;}return 'Jun';}
function orgU(au,nu){if(!nu)return 0;var o=1-au/nu;return (o<0?1:o)*100;}   // Organic% = units without an ad click (same as the weekly report)
function acls(p){p=Number(p)||0;return p<=5?'roas-ok':(p<=12?'roas-wn':'roas-bd');}
function bacls(bcg,p){p=Number(p)||0;var b=(bcg==='Brand')?[5,8]:[18,26];return p<=b[0]?'roas-ok':(p<=b[1]?'roas-wn':'roas-bd');}
function monthAgg(series){const o={};series.forEach(x=>{const m=moOf(x.week);(o[m]=o[m]||{sp:0,sa:0});o[m].sp+=x.spend;o[m].sa+=x.sales;});return o;}
function moList(weeks){return [...new Set(weeks.map(moOf))];}
function bcgPill(b){const m={'Brand':'p-brand','Competitor':'p-comp','Generic':'p-gen'};return b?'<span class="pill '+(m[b]||'')+'">'+b+'</span>':'';}
function kpi(l,v,s){return '<div class="card"><div class="lbl">'+l+'</div><div class="val">'+v+'</div>'+(s?'<div class="sub2">'+s+'</div>':'')+'</div>';}
function csvBtn(id){return '<button class="csv" onclick="dl(\''+id+'\')">⬇ CSV</button>';}
function dl(id){const t=document.getElementById(id);let rows=[];t.querySelectorAll('tr').forEach(tr=>{let r=[];tr.querySelectorAll('th,td').forEach(c=>r.push('"'+c.innerText.replace(/"/g,'""')+'"'));rows.push(r.join(','));});const b=new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=id+'.csv';a.click();}
function tab(p){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.p===p));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id===p));}
function mkChart(id,cfg){if(CH[id])CH[id].destroy();const el=document.getElementById(id);if(el)CH[id]=new Chart(el,cfg);}
function sec(title,note,inner,id){return '<div class="sec">'+(id?csvBtn(id):'')+'<h3>'+title+'</h3>'+(note?'<div class="note">'+note+'</div>':'')+inner+'</div>';}
const TEAL='#1CBFBB',AMZ='#FF9900',GREY='#cbd5d5';const CB={Brand:'#0ea5e9',Competitor:'#f59e0b',Generic:'#22c55e'};
function momBadge(cur,prev,inv){if(prev==null||prev===0||cur==null)return '';var d=(cur-prev)/Math.abs(prev)*100;var up=d>=0;var good=inv?!up:up;return '<span class="badge '+(good?'b-up':'b-dn')+'">'+(up?'▲':'▼')+Math.abs(d).toFixed(0)+'%</span>';}
const CATCOL=['#1CBFBB','#18A6A3','#0ea5e9','#f59e0b','#22c55e','#a855f7','#ef4444','#94a3b8'];

function projFooter(){const pj=D.sales&&D.sales.projection;if(!pj)return '';
 if(pj.complete||pj.suppressed)return sec('📊 '+pj.live_month+(pj.suppressed?' — month so far (actuals)':' — Month Closed (actuals)'),pj.suppressed?pj.basis:'The month is closed — every figure is actual, nothing is projected.','<div class="proj">'
   +kpi('Net Sales · '+(pj.suppressed?'so far':'full month'),inr(pj.actual_net),num(pj.actual_units)+' units')+kpi('Ad-Spend · '+(pj.suppressed?'so far':'full month'),inr(pj.actual_ad_spend),pj.live_month)
   +kpi('Ad-Sales · '+(pj.suppressed?'so far':'full month'),inr(pj.actual_ad_sales),pj.live_month)+kpi('TACOS · '+(pj.suppressed?'so far':'full month'),pct2(pj.actual_ad_spend/pj.actual_net*100),'spend / net sales')+'</div>');
 return sec('📈 '+pj.live_month+(pj.complete?' — Month Closed (actuals)':' — Full-Month Projection'),
  pj.basis,
  '<div class="proj">'
   +kpi('Net Sales · projected',inr(pj.proj_net),'actual '+inr(pj.actual_net))
   +kpi('Ad-Spend · projected',inr(pj.proj_ad_spend),'held flat · actual '+inr(pj.actual_ad_spend))
   +kpi('Ad-Sales · projected',inr(pj.proj_ad_sales),'actual '+inr(pj.actual_ad_sales))
   +kpi('TACOS · projected',pct2(pj.proj_ad_spend/pj.proj_net*100),'spend / net — improving')

 html+=sec('BCG — Period totals','','<div class="tbl-scroll"><table id="tBcgT"><thead><tr><th class="l">BCG</th><th>Ad-Spend</th><th>% Spend</th><th>Ad-Sales</th><th>% Sales</th><th>ACOS</th></tr></thead><tbody>'+r+'</tbody></table></div>','tBcgT');

 D.ads.by_adtype.forEach(x=>{html+=kpi(x.type,'<span class="'+acls(x.sales?x.spend/x.sales*100:0)+'">'+(x.sales?pct2(x.spend/x.sales*100):'—')+'</span>','ACOS · '+inr(x.spend)+' ('+pct(x.share_spend)+')');});
 html+='</div>';

 html+=sec('ACOS by Ad-Type — WoW','lower is better','<div class="chwrap"><canvas id="cAtR"></canvas></div>')+'</div>';
 // Ad-Type WoW table
 let head='<th class="l">Week</th>'+T.map(t=>'<th>'+t+' ACOS</th>').join('');
 const nA=()=>{const o={};T.forEach(t=>o[t]=[0,0]);return o;};
 const aRow=(lab,a,cls)=>'<tr'+(cls?' class="'+cls+'"':'')+'><td class="l">'+lab+'</td>'+T.map(t=>{const sp=a[t][0],sa=a[t][1];return '<td'+(cls?'':' class="'+acls(sa?sp/sa*100:0)+'"')+'>'+(sa?pct2(sp/sa*100):'—')+'</td>';}).join('')+'</tr>';
 let r='',g=nA(),mo=nA(),cur=null;
 weeks.forEach((wk,i)=>{const m=moOf(wk);if(cur&&m!==cur){r+=aRow(cur+' Total',mo,'sub');mo=nA();}cur=m;const wa=nA();T.forEach(t=>{const x=aw[t][i];mo[t][0]+=x.spend;mo[t][1]+=x.sales;g[t][0]+=x.spend;g[t][1]+=x.sales;wa[t]=[x.spend,x.sales];});r+=aRow(wk,wa);});
 r+=aRow(cur+' Total',mo,'sub');r+=aRow('Grand Total',g,'tot');
 html+=sec('Ad-Type — Week on Week detail','','<div class="tbl-scroll"><table id="tAtW"><thead><tr>'+head+'</tr></thead><tbody>'+r+'</tbody></table></div>','tAtW');
 (function(){const MOS=moList(weeks);let rr='';const tT={};MOS.forEach(mo=>tT[mo]={sp:0,sa:0});
  T.forEach(t=>{const m=monthAgg(aw[t]);let row='<tr><td class="l">'+t+'</td>';MOS.forEach(mo=>{const v=m[mo]||{sp:0,sa:0};tT[mo].sp+=v.sp;tT[mo].sa+=v.sa;row+='<td>'+inr(v.sp)+'</td><td>'+inr(v.sa)+'</td><td class="'+acls(v.sa?v.sp/v.sa*100:0)+'">'+(v.sa?pct2(v.sp/v.sa*100):'—')+'</td>';});rr+=row+'</tr>';});
  let tot='<tr class="tot"><td class="l">Total</td>';MOS.forEach(mo=>{const v=tT[mo];tot+='<td>'+inr(v.sp)+'</td><td>'+inr(v.sa)+'</td><td>'+(v.sa?pct2(v.sp/v.sa*100):'—')+'</td>';});rr+=tot+'</tr>';
  const hd='<th class="l">Ad-Type</th>'+MOS.map(mo=>'<th>'+mo+' Ad-Spend</th><th>'+mo+' Ad-Sales</th><th>'+mo+' ACOS</th>').join('');
  html+=sec('Ad-Type — Monthly split ('+MOS.join(' / ')+')','','<div class="tbl-scroll"><table id="tAtM"><thead><tr>'+hd+'</tr></thead><tbody>'+rr+'</tbody></table></div>','tAtM');})();
 // MTD ad-type
 r=D.ads.by_adtype.map(x=>'<tr><td class="l">'+x.type+'</td><td>'+inr(x.spend)+'</td><td>'+pct(x.share_spend)+'</td><td>'+inr(x.sales)+'</td><td class="'+acls(x.spend/x.sales*100)+'">'+pct2(x.spend/x.sales*100)+'</td><td>'+num(x.impr)+'</td><td>'+num(x.clicks)+'</td></tr>').join('');
 const tt=D.ads.total;
 r+='<tr class="tot"><td class="l">Total</td><td>'+inr(tt.spend)+'</td><td>100.0%</td><td>'+inr(tt.sales)+'</td><td>'+pct2(tt.spend/tt.sales*100)+'</td><td>'+num(tt.impr)+'</td><td>'+num(tt.clicks)+'</td></tr>';
 html+=sec('Ad-Type — Period totals','SP = Sponsored Products · SB (SOV) = Reserved banner · SD = Sponsored Display','<div class="tbl-scroll"><table id="tAtT"><thead><tr><th class="l">Ad-Type</th><th>Ad-Spend</th><th>% Spend</th><th>Ad-Sales</th><th>ACOS</th><th>Impr</th><th>Clicks</th></tr></thead><tbody>'+r+'</tbody></table></div>','tAtT');
 // campaigns + keywords
 r=D.ads.campaigns.map((x,i)=>'<tr><td>'+(i+1)+'</td><td class="l">'+x.name+'</td><td>'+bcgPill((x.bcg||'').split('/')[0])+'</td><td>'+inr(x.spend)+'</td><td>'+inr(x.sales)+'</td><td class="'+acls(x.spend/x.sales*100)+'">'+pct2(x.spend/x.sales*100)+'</td></tr>').join('');
 html+=sec('Top 20 Campaigns (by Ad-Sales)','Top 20 of '+D.ads.campaigns_grand.count+' — Total reflects ALL','<div class="tbl-scroll"><table id="tCamp"><thead><tr><th>#</th><th class="l">Campaign</th><th>BCG</th><th>Ad-Spend</th><th>Ad-Sales</th><th>ACOS</th></tr></thead><tbody>'+r+'<tr class="tot"><td></td><td class="l">All '+D.ads.campaigns_grand.count+'</td><td></td><td>'+inr(D.ads.campaigns_grand.spend)+'</td><td>'+inr(D.ads.campaigns_grand.sales)+'</td><td>'+pct2(D.ads.campaigns_grand.spend/D.ads.campaigns_grand.sales*100)+'</td></tr></tbody></table></div>','tCamp');
 r=D.ads.keywords.map((x,i)=>'<tr><td>'+(i+1)+'</td><td class="l">'+x.term+'</td><td>'+bcgPill((x.bcg||'').split('/')[0])+'</td><td>'+inr(x.spend)+'</td><td>'+inr(x.sales)+'</td><td class="'+acls(x.spend/x.sales*100)+'">'+pct2(x.spend/x.sales*100)+'</td></tr>').join('');
 html+=sec('Top 30 Search Terms (by Ad-Sales)','Top 30 of '+num(D.ads.keywords_grand.count)+' — Total reflects ALL','<div class="tbl-scroll"><table id="tKw"><thead><tr><th>#</th><th class="l">Search Term</th><th>BCG</th><th>Ad-Spend</th><th>Ad-Sales</th><th>ACOS</th></tr></thead><tbody>'+r+'<tr class="tot"><td></td><td class="l">All '+num(D.ads.keywords_grand.count)+'</td><td></td><td>'+inr(D.ads.keywords_grand.spend)+'</td><td>'+inr(D.ads.keywords_grand.sales)+'</td><td>'+pct2(D.ads.keywords_grand.spend/D.ads.keywords_grand.sales*100)+'</td></tr></tbody></table></div>','tKw');
 html+=projFooter();document.getElementById('adtype').innerHTML=html;
 window.catAdsView=function(mode){const src=mode?cats.filter(c=>c.cat!=='MG'&&c.cat!=='JMG'):cats;mkChart('cAtCat',{type:'bar',data:{labels:src.map(c=>c.cat),datasets:[{label:'Ad-Spend',data:src.map(c=>c.ad_spend),backgroundColor:'#bfeae9'},{label:'Ad-Sales',data:src.map(c=>c.ad_sales),backgroundColor:TEAL}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>c.dataset.label+': '+inr(c.parsed.y)}}},scales:{x:{ticks:{autoSkip:false,maxRotation:60,minRotation:45,font:{size:10}}},y:{ticks:{callback:v=>inr(v)}}}}});};
 if(cats.length) catAdsView(0);
 mkChart('cAtR',{data:{labels:weeks,datasets:T.map((t,i)=>({label:t,data:aw[t].map(x=>x.acos),borderColor:CATCOL[i],backgroundColor:CATCOL[i],tension:.3,type:'line'}))},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>c.dataset.label+': '+c.parsed.y.toFixed(2)+'%'}}},scales:{y:{ticks:{callback:v=>v.toFixed(0)+'%'}}}}});
}
function renderDayparting(){
 const P=D.insights&&D.insights.dayparting;const el=document.getElementById('daypart');if(!P||!el){if(el)el.innerHTML='';return;}
 let html='<div style="display:inline-block;font-size:12px;font-weight:600;color:#0f766e;background:#ecfeff;border:1px solid #99f6e4;border-radius:999px;padding:4px 12px;margin-bottom:12px">🕒 Timing & Day-Type · behavioural view</div>';
 html+='<div class="banner">When Sujata sells — by hour, by day of week, and on event days. Use it to time bids and shift budget to the highest-yield windows. <i>'+P.as_of+'</i></div>';
 html+='<div class="grid kpis">'+P.rules.slice(0,4).map(x=>kpi(x.conf+' confidence',x.r,'')).join('')+'</div>';
 html+='<div class="two">'+sec('Best hours of the day','share of daily sales by time-block · peak '+P.peak_hour+(P.hour_profile_event?' · event days shift LATE — 26% of sales land after 9 PM vs 19% on normal days ('+(P.event_hours_note||'')+')':''),'<div class="chwrap"><canvas id="cHour"></canvas></div>')+sec('Best days of the week','avg units/day · '+P.best_day+' strongest · '+P.weak_day+' softest','<div class="chwrap"><canvas id="cDow"></canvas></div>')+'</div>';
 html+=sec('Event days vs a normal day (BAU)','how much events lift sales — plan inventory + bids around them. Peak days = the event\'s best 3 days; whole event = every day of the window. All measured against a normal day of the same weekday, so weekend events are not flattered.','<div class="tbl-scroll"><table id="tEv"><thead><tr><th class="l">Event</th><th>Peak days (× a normal day)</th><th>Whole event (× a normal day)</th><th>Net sales in the window</th></tr></thead><tbody>'+P.events.map(e=>'<tr><td class="l">'+e.name+'</td><td><b>'+e.mult.toFixed(1)+'×</b>'+(e.units_mult?' <span style="color:#64748b">('+e.units_mult.toFixed(1)+'× units)</span>':'')+'</td><td>'+(e.full_mult?e.full_mult.toFixed(1)+'× over '+e.full_days+' days':'—')+'</td><td>'+inr(e.sales)+'</td></tr>').join('')+'<tr><td class="l">Event-day AOV</td><td colspan="3">'+inr(P.event_asp)+' vs '+inr(P.bau_asp)+' on a normal day — shoppers buy slightly bigger during events</td></tr></tbody></table></div>','tEv');
 html+=sec('Timing playbook — all rules','confidence graded by the daily-forecast workstream','<div class="tbl-scroll"><table><thead><tr><th class="l">Rule</th><th>Confidence</th></tr></thead><tbody>'+P.rules.map(x=>'<tr><td class="l">'+x.r+'</td><td>'+x.conf+'</td></tr>').join('')+'</tbody></table></div>');
 html+=sec('When each category peaks — all categories',(P.per_cat_note||'push each category in its own best window'),'<div class="tbl-scroll"><table><thead><tr><th class="l">Category</th><th>Peak hour</th><th>Push window</th><th>Best day</th></tr></thead><tbody>'+P.per_cat.map(c=>'<tr><td class="l">'+c.cat+'</td><td>'+c.peak+'</td><td>'+c.window+'</td><td>'+(c.best_day||'')+'</td></tr>').join('')+'</tbody></table></div>');
 el.innerHTML=html;
 mkChart('cHour',{type:'bar',data:{labels:P.hour_profile.map(h=>h.part),datasets:[{label:'Normal day (BAU)',data:P.hour_profile.map(h=>h.pct),backgroundColor:TEAL},{label:'Event day (Freedom Aug 7–9)',data:(P.hour_profile_event||[]).map(h=>h.pct),backgroundColor:AMZ}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom',display:!!P.hour_profile_event},tooltip:{callbacks:{label:c=>c.dataset.label+': '+c.parsed.y.toFixed(1)+'% of daily sales'}}},scales:{y:{ticks:{callback:v=>v+'%'}}}}});
 mkChart('cDow',{type:'bar',data:{labels:P.dow.map(d=>d.d),datasets:[{label:'avg units/day',data:P.dow.map(d=>d.u),backgroundColor:P.dow.map(d=>d.d==='Sun'?TEAL:(d.d==='Fri'?'#f59e0b':'#bfeae9'))}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>num(c.parsed.y)+' units/day'}}},scales:{y:{ticks:{callback:v=>num(v)}}}}});
}
