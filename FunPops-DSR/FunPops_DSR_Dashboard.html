<style>
:root{--ns-teal:#1CBFBB;--ns-black:#020202;--ns-gray:#6b6b6b;--ns-border:#d0d7de}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,'Segoe UI',Roboto,sans-serif;background:#f4f5f7;color:#111;font-size:13px}
.header{background:linear-gradient(135deg,#020202 0%,#1a1a1a 100%);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:4px solid var(--ns-teal)}
.brandmark{font-weight:800;font-size:19px}.brandmark span{color:var(--ns-teal)}
.header h1{font-size:18px;font-weight:600}.header .subtitle{color:#b3b3b3;font-size:12px;margin-top:2px}
.wrap{padding:14px 18px}
.preview-bar{background:#FFF7E0;border:1px dashed #D9A400;color:#7A5A00;border-radius:6px;padding:7px 12px;margin-bottom:12px;font-size:12px}
.wb-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.wb-btn{border:1px solid var(--ns-border);background:#fff;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;color:#333;font-family:inherit}
.wb-btn.active{background:var(--ns-teal);border-color:var(--ns-teal);color:#fff}
.sheet-tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid #274E13;margin-bottom:0}
.sh-btn{border:1px solid var(--ns-border);border-bottom:none;background:#e9ecef;padding:6px 12px;cursor:pointer;font-size:12px;white-space:nowrap;border-radius:6px 6px 0 0;font-family:inherit;color:#333}
.sh-btn.active{background:#274E13;color:#fff;border-color:#274E13}
.toolbar{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:12px;color:var(--ns-gray);gap:10px;flex-wrap:wrap}
.csv-btn{background:#fff;border:1px solid var(--ns-border);padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
.grid-wrap{overflow:auto;background:#fff;border:1px solid var(--ns-border);max-height:78vh}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed}
table.grid td{border-right:1px solid #c9c9c9;border-bottom:1px solid #c9c9c9;padding:5px 6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:26px}
table.grid td.lab{white-space:normal;line-height:1.25}
table.grid td.sticky{position:sticky;z-index:2}
table.grid tr.hdr td{position:sticky;top:0;z-index:3}
table.grid tr.hdr td.sticky{z-index:4}
table.grid tr.sep td{height:8px;padding:0}
.notes{margin-top:12px;background:#fff;border:1px solid var(--ns-border);border-radius:6px;padding:10px 14px;font-size:12px;color:#444;line-height:1.7}
.notes li{margin-left:18px}
</style>

let D = null;
const SKEY='ns_dsr_key_FP';
function b64ToBytes(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0))}
function bytesToB64(u){let s='';u.forEach(x=>s+=String.fromCharCode(x));return btoa(s)}
async function deriveKey(pw){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64ToBytes(ENC_SALT),iterations:100000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['decrypt'])}
async function decryptWith(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(ENC_IV)},key,b64ToBytes(ENC_DATA));return JSON.parse(new TextDecoder().decode(pt))}
function show(){document.getElementById('pwOverlay').style.display='none';document.getElementById('dashboardContent').style.display='block';init()}
/* Session-only unlock memory (NorthSide override, Akash 03.10.2026): the derived key (never the password) is kept in sessionStorage for this tab only and is gone when the tab closes. */
async function unlock(){const f=document.getElementById('pwInput');const pw=f.value;if(!pw){f.focus();return}
  try{const key=await deriveKey(pw);D=await decryptWith(key);
    try{const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));sessionStorage.setItem(SKEY,JSON.stringify({s:ENC_SALT,k:bytesToB64(raw)}))}catch(e){}
    f.value='';show()}catch(e){document.getElementById('pwErr').style.display='block';f.value='';f.focus()}}
async function tryResume(){try{const j=JSON.parse(sessionStorage.getItem(SKEY)||'null');if(!j||j.s!==ENC_SALT){sessionStorage.removeItem(SKEY);return}
  const key=await crypto.subtle.importKey('raw',b64ToBytes(j.k),{name:'AES-GCM'},false,['decrypt']);D=await decryptWith(key);show()}catch(e){try{sessionStorage.removeItem(SKEY)}catch(_){}}}

const PLAT_ORDER=['amazon','blinkit','zepto','bigbasket'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ADD=['units','revenue','spend','ad_sales','impressions','clicks','atc','ad_units','ad_orders'];
const DAYW=76;
let S={p:'blinkit',sheet:null};

function isNum(v){return typeof v==='number'&&isFinite(v)}
function div(a,b){return (isNum(a)&&isNum(b)&&b!==0)?a/b:null}
function dim(ym){const [y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()}
function grp(n,dec){return n.toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec})}
function decOf(nf){const m=nf.match(/\.(0+)/);return m?m[1].length:0}
function fmt(nf,v){
  if(v===null||v===undefined||v==='')return '';
  if(typeof v==='string')return v;
  if(!isNum(v))return '–';
  nf=nf||'General';
  if(nf.includes('%'))return grp(v*100,decOf(nf))+'%';
  if(nf.includes('₹'))return '₹'+grp(v,decOf(nf));
  if(nf==='General')return Number.isInteger(v)?grp(v,0):grp(v,2);
  return grp(v,decOf(nf))}
function css(st,extra){let s='';if(st.bg)s+='background:#'+st.bg+';';if(st.fg)s+='color:#'+st.fg+';';if(st.b)s+='font-weight:700;';if(st.i)s+='font-style:italic;';
  s+='font-size:'+Math.round((st.sz||11)*1.2)+'px;';return s+(extra||'')}

/* ---------- one formula set (section 6 + Akash decisions D2, D3, D5) ---------- */
function monthDays(p,ym){const d=D.platforms[p].days;return Object.keys(d).filter(k=>k.startsWith(ym)).sort()}
function sums(p,keys){const d=D.platforms[p].days;const s={};ADD.forEach(k=>{let t=0,any=false;keys.forEach(x=>{const v=d[x][k];if(isNum(v)){t+=v;any=true}});s[k]=any?t:null});return s}
function ratios(s,p){const h=D.platforms[p].has;const on=isNum(s.spend)&&s.spend>0;const m={...s};
  m.broas=on?div(s.revenue,s.spend):null;m.ad_roas=on?div(s.ad_sales,s.spend):null;m.acos=on?div(s.spend,s.ad_sales):null;
  m.ctr=h.clicks?div(s.clicks,s.impressions):null;m.cpc=h.clicks?div(s.spend,s.clicks):null;
  m.conv_clicks=(h.clicks&&h.ad_orders)?div(s.ad_orders,s.clicks):null;m.conv_atc=(h.atc&&h.ad_units)?div(s.ad_units,s.atc):null;
  const o=(isNum(s.revenue)&&s.revenue>0&&isNum(s.ad_sales))?(s.revenue-s.ad_sales)/s.revenue:null;m.organic=isNum(o)?Math.max(0,o):null;m.organic_neg=isNum(o)&&o<0;
  if(!h.clicks){m.clicks=null}if(!h.atc){m.atc=null}if(!h.ad_units){m.ad_units=null}if(!h.ad_orders){m.ad_orders=null}
  return m}
function sheetData(p,ym){const days=monthDays(p,ym);const n=dim(ym);const budget=(D.platforms[p].budgets||{})[ym];
  const perDay={};let cum=0;
  days.forEach(k=>{const d=+k.slice(8,10);const r=ratios({...sums(p,[k])},p);r.stock=D.platforms[p].days[k].stock;
    if(isNum(budget)&&budget>0){const left=budget-cum;r.target=left<=0?'Budget used':left/(n-(d-1));cum+=(r.spend||0);r.pace=div(cum,budget*d/n)}else{r.target=null;r.pace=null;cum+=(r.spend||0)}
    perDay[k]=r});
  const mtd=ratios(sums(p,days),p);mtd.target=isNum(budget)?budget:null;const e=days.length?+days[days.length-1].slice(8,10):0;mtd.pace=(isNum(budget)&&budget>0&&e)?div(mtd.spend||0,budget*e/n):null;mtd.stock=null;
  return {days,perDay,mtd}}
function avgOf(sd,key){const v=sd.days.map(k=>sd.perDay[k][key]).filter(isNum);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}

/* ---------- daily report sheet (same rows, colours and order as the DSR tab) ---------- */
function leftOf(p,c){const w=D.platforms[p].widths;let x=0;for(let i=1;i<c;i++)x+=(w[i]||100);return x}
function renderDaily(p,ym){const P=D.platforms[p];const sd=sheetData(p,ym);const lc=P.label_cols;
  let h='<colgroup>';for(let i=1;i<=lc;i++)h+=`<col style="width:${P.widths[i]||100}px">`;sd.days.forEach(()=>h+=`<col style="width:${DAYW}px">`);h+='</colgroup>';
  P.rows.forEach(row=>{const k=row.key;const isHdr=k==='HEADER',isSep=k==='SEP';
    h+=`<tr class="${isHdr?'hdr':''}${isSep?' sep':''}">`;
    row.cells.forEach(c=>{let txt='';
      if(c.role==='label')txt=(isHdr&&c.c===1)?P.title:(c.text==null?'':c.text);
      else if(isHdr)txt=c.text||'';
      else if(c.role==='avg'){if(c.fml&&!['SEP','BLOCKONLY','stock'].includes(k)){const a=avgOf(sd,k);txt=isNum(a)?('Avg= '+(c.cur?'₹':'')+(c.dec===0?Math.round(a):Math.round(a*10)/10)):'–'}}
      else if(c.role==='mtd'){if(!['SEP','BLOCKONLY','stock','HEADER'].includes(k)){const v=sd.mtd[k];txt=fmt(row.mtd_nf,v);if(k==='organic'&&sd.mtd.organic_neg)txt+=' *';if(txt==='')txt='–'}}
      const cls='sticky'+(c.role==='label'?' lab':'');
      h+=`<td class="${cls}" ${c.rs>1?`rowspan="${c.rs}"`:''} ${c.cs>1?`colspan="${c.cs}"`:''} style="${css(c.st,'left:'+leftOf(p,c.c)+'px;'+(c.role==='label'&&c.st.al!=='center'?'text-align:left;':''))}">${txt}</td>`});
    sd.days.forEach(day=>{let txt='';
      if(isHdr){const d=+day.slice(8,10);txt=d+'-'+MON[+day.slice(5,7)-1];h+=`<td style="${css(P.hdr_day)}">${txt}</td>`;return}
      if(!isSep&&k!=='BLOCKONLY'){const v=sd.perDay[day][k];txt=fmt(row.day.nf,v);if(k==='organic'&&sd.perDay[day].organic_neg)txt+=' *';
        if(txt===''&&k!=='stock')txt='–'}
      const wrap=(typeof sd.perDay[day]?.[k]==='string')?'white-space:normal;line-height:1.1;font-size:11px;':'';
      h+=`<td style="${css(row.day,wrap)}">${txt}</td>`});
    h+='</tr>'});
  const g=document.getElementById('grid');g.innerHTML=h;let tw=0;for(let i=1;i<=lc;i++)tw+=(P.widths[i]||100);g.style.width=(tw+sd.days.length*DAYW)+'px';
  const last=sd.days.length?sd.days[sd.days.length-1]:null;
  document.getElementById('sheetInfo').textContent=last?`${P.title} · ${MON[+ym.slice(5)-1]} ${ym.slice(0,4)} · data to ${last.slice(8)}.${last.slice(5,7)}.${last.slice(0,4)}`:''}

/* ---------- Monthly Sales Summary (as in the DSR tab) ---------- */
function renderMSS(p){const P=D.platforms[p];let h='<colgroup><col style="width:230px">';for(let i=2;i<=19;i++)h+='<col style="width:100px">';h+='</colgroup>';
  P.mss.forEach((row,ri)=>{h+=`<tr class="${ri===0?'hdr':''}">`;row.cells.forEach(c=>{let v=c.v;let txt=(v===null||v==='None')?'':(typeof v==='number'?fmt(c.st.nf.replace('[$₹-4009]\\ ','[$₹]'),v):v);
    if(ri===0&&c.c===1)txt=P.title;
    h+=`<td class="${c.c===1?'sticky lab':''}" ${c.rs>1?`rowspan="${c.rs}"`:''} ${c.cs>1?`colspan="${c.cs}"`:''} style="${css(c.st,c.c===1?'left:0;text-align:left;':'')}">${txt}</td>`});h+='</tr>'});
  const g=document.getElementById('grid');g.innerHTML=h;g.style.width=(230+18*100)+'px';document.getElementById('sheetInfo').textContent=P.title+' · Monthly Sales Summary'}

/* ---------- shell ---------- */
function sheetsFor(p){const s=new Set();Object.keys(D.platforms[p].days).forEach(k=>s.add(k.slice(0,7)));return ['MSS',...[...s].sort().reverse()]}
function sheetName(s){return s==='MSS'?'Monthly Sales Summary':MON[+s.slice(5)-1]+s.slice(0,4)+' Daily Report'}
function render(){
  document.getElementById('wbTabs').innerHTML=PLAT_ORDER.map(p=>`<button class="wb-btn${p===S.p?' active':''}" onclick="setP('${p}')">${D.platforms[p].label}</button>`).join('');
  const sh=sheetsFor(S.p);if(!sh.includes(S.sheet))S.sheet=sh[1]||'MSS';
  document.getElementById('sheetTabs').innerHTML=sh.map(s=>`<button class="sh-btn${s===S.sheet?' active':''}" onclick="setS('${s}')">${sheetName(s)}</button>`).join('');
  if(S.sheet==='MSS')renderMSS(S.p);else renderDaily(S.p,S.sheet);
  document.getElementById('notes').innerHTML=D.notes.filter(n=>n[0].includes('all')||n[0].includes(S.p)).map(n=>`<li>${n[1]}</li>`).join('')}
function setP(p){S.p=p;render()}
function setS(s){S.sheet=s;render()}
function csv(){const t=document.getElementById('grid');const lines=[...t.querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>'"'+td.innerText.replace(/"/g,'""')+'"').join(','));
  const b=new Blob(['﻿'+lines.join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`FunPops_${S.p}_${S.sheet}.csv`;a.click()}
function init(){document.getElementById('title').textContent=D.brand+' — Daily Sales & Marketing Report';
  const last=PLAT_ORDER.map(p=>Object.keys(D.platforms[p].days).sort().pop()).sort().pop();
  document.getElementById('subtitle').textContent='Amazon · Blinkit · Zepto · BigBasket | Data to '+last.slice(8)+'.'+last.slice(5,7)+'.'+last.slice(0,4)+' | Last updated: '+D.last_updated+' | Confidential';
  render()}
tryResume();
document.getElementById("pwInput").focus();
</script>
