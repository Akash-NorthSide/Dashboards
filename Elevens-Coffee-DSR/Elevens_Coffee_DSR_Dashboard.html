<title>Elevens Coffee — Daily Sales & Marketing Report</title>
<style>
:root{--ns-teal:#1CBFBB;--ns-black:#020202;--ns-gray:#6b6b6b;--ns-border:#d0d7de}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,'Segoe UI',Roboto,sans-serif;background:#f4f5f7;color:#111;font-size:13px}

.header{background:linear-gradient(135deg,#020202 0%,#1a1a1a 100%);color:#fff;padding:12px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:4px solid #1CBFBB}
.header .ns-logo{height:32px;display:block}
.header .hdr-mid{flex:1;min-width:220px;border-left:1px solid #3a3a3a;padding-left:18px}
.header h1{font-size:18px;font-weight:600;letter-spacing:.2px}
.header .subtitle{color:#b3b3b3;font-size:12px;margin-top:3px}
.brand-chip{background:#fff;border-radius:8px;padding:5px 10px;display:flex;align-items:center;height:46px}
.brand-chip img{height:34px;display:block}
.brand-chip .wm{font-weight:800;font-size:17px;color:#020202;letter-spacing:.5px;white-space:nowrap}
#pwOverlay{position:fixed;inset:0;background:linear-gradient(135deg,#020202 0%,#0f2b2a 100%);display:flex;align-items:center;justify-content:center;z-index:9999;font-family:Arial,'Segoe UI',Roboto,sans-serif}
.pw-card{background:#fff;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.45);text-align:center;max-width:400px;width:92%;overflow:hidden}
.pw-band{background:#020202;border-bottom:4px solid #1CBFBB;padding:16px 20px;display:flex;align-items:center;justify-content:center;gap:16px}
.pw-band .ns-logo{height:28px}
.pw-band .sep{width:1px;height:36px;background:#3a3a3a}
.pw-band .brand-chip{height:42px}
.pw-band .brand-chip img{height:30px}
.pw-body{padding:26px 30px 24px}
.pw-body h2{font-size:18px;color:#020202;margin-bottom:4px}
.pw-body .pw-sub{font-size:13px;color:#7D7D7D;margin-bottom:18px}
.pw-body input{width:100%;padding:11px 14px;border:2px solid #E6E4E4;border-radius:8px;font-size:15px;margin-bottom:12px;font-family:inherit;outline:none}
.pw-body input:focus{border-color:#1CBFBB}
.pw-body button{width:100%;padding:11px;background:#1CBFBB;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.pw-body button:hover{background:#17a7a3}
#pwErr{color:#EB5757;font-size:13px;margin-top:10px;display:none}
.pw-foot{font-size:11px;color:#9a9a9a;padding:0 20px 16px}

.wrap{padding:14px 18px}
.preview-bar{background:#FFF7E0;border:1px dashed #D9A400;color:#7A5A00;border-radius:6px;padding:7px 12px;margin-bottom:12px;font-size:12px}
.wb-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.wb-btn{border:1px solid var(--ns-border);background:#fff;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;color:#333;font-family:inherit}
.wb-btn.active{background:var(--ns-teal);border-color:var(--ns-teal);color:#fff}
.sheet-tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid #274E13}
.sh-btn{border:1px solid var(--ns-border);border-bottom:none;background:#e9ecef;padding:6px 12px;cursor:pointer;font-size:12px;white-space:nowrap;border-radius:6px 6px 0 0;font-family:inherit;color:#333}
.sh-btn.active{background:#274E13;color:#fff;border-color:#274E13}
.toolbar{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:12px;color:var(--ns-gray);gap:10px;flex-wrap:wrap}
.csv-btn{background:#fff;border:1px solid var(--ns-border);padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
.grid-wrap{overflow:auto;background:#fff;border:1px solid var(--ns-border);max-height:78vh}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed}
table.grid td{border-right:1px solid #c9c9c9;border-bottom:1px solid #c9c9c9;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:24px;font-size:12px;background:#fff;vertical-align:middle}
table.grid td.w{white-space:normal;line-height:1.25}
table.grid td.sticky{position:sticky;z-index:2}
table.grid tr.hdr td{position:sticky;top:0;z-index:3}
table.grid tr.hdr td.sticky{z-index:4}
.notes{margin-top:12px;background:#fff;border:1px solid var(--ns-border);border-radius:6px;padding:10px 14px;font-size:12px;color:#444;line-height:1.7}
.notes li{margin-left:18px}
@media(max-width:700px){table.grid td.sticky:not(.c0){position:static}.header .hdr-mid{border-left:none;padding-left:0}}
</style>
</head>

let D = null;
const SKEY='ns_dsr_key_EC';
function b64ToBytes(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0))}
function bytesToB64(u){let s='';u.forEach(x=>s+=String.fromCharCode(x));return btoa(s)}
async function deriveKey(pw){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64ToBytes(ENC_SALT),iterations:100000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['decrypt'])}
async function decryptWith(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(ENC_IV)},key,b64ToBytes(ENC_DATA));const ds=new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(ds).text())}
function show(){document.getElementById('pwOverlay').style.display='none';document.getElementById('dashboardContent').style.display='block';init()}
/* Session-only unlock (NorthSide override): the derived key, never the password, is kept in sessionStorage for this tab only. */
async function unlock(){const f=document.getElementById('pwInput');const pw=f.value;if(!pw){f.focus();return}
  try{const key=await deriveKey(pw);D=await decryptWith(key);
    try{const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));sessionStorage.setItem(SKEY,JSON.stringify({s:ENC_SALT,k:bytesToB64(raw)}))}catch(e){}
    f.value='';show()}catch(e){document.getElementById('pwErr').style.display='block';f.value='';f.focus()}}
async function tryResume(){try{const j=JSON.parse(sessionStorage.getItem(SKEY)||'null');if(!j||j.s!==ENC_SALT){sessionStorage.removeItem(SKEY);return}
  const key=await crypto.subtle.importKey('raw',b64ToBytes(j.k),{name:'AES-GCM'},false,['decrypt']);D=await decryptWith(key);show()}catch(e){try{sessionStorage.removeItem(SKEY)}catch(_){}}}

let S={w:0,s:0};
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function stCss(st){let s='';if(st.bg)s+='background:#'+st.bg+';';if(st.fg)s+='color:#'+st.fg+';';if(st.b)s+='font-weight:700;';if(st.i)s+='font-style:italic;';
  if(st.sz)s+='font-size:'+Math.round(Math.min(st.sz,14)*1.15)+'px;';s+='text-align:'+({c:'center',r:'right'}[st.al]||'left')+';';return s}
function renderSheet(){const W=D.workbooks[S.w];const sh=W.sheets[S.s];const ST=W.styles;const n=sh.w.length;
  const left=[0];for(let i=1;i<=n;i++)left[i]=left[i-1]+sh.w[i-1];
  let h='<colgroup>'+sh.w.map(x=>`<col style="width:${x}px">`).join('')+'</colgroup>';
  const occ=new Set();
  sh.rows.forEach((row,ri)=>{const [ht,cells]=row;h+=`<tr${ri===0?' class="hdr"':''}${ht?` style="height:${ht}px"`:''}>`;
    const byC={};cells.forEach(c=>byC[c[0]]=c);
    for(let c=0;c<n;c++){if(occ.has(ri+':'+c))continue;const e=byC[c];const sticky=c<sh.fz;
      let cls=(sticky?'sticky c'+c:'');let style=sticky?`left:${left[c]}px;`:'';let span='';let txt='';
      if(e){const st=ST[e[2]]||{};txt=esc(e[1]);style+=stCss(st);if(st.w)cls+=' w';
        const rs=e[3]||1,cs=e[4]||1;if(rs>1)span+=` rowspan="${rs}"`;if(cs>1)span+=` colspan="${cs}"`;
        for(let a=0;a<rs;a++)for(let b=0;b<cs;b++)if(a||b)occ.add((ri+a)+':'+(c+b));}
      h+=`<td${cls?` class="${cls.trim()}"`:''}${span} style="${style}">${txt}</td>`}
    h+='</tr>'});
  const g=document.getElementById('grid');g.innerHTML=h;g.style.width=left[n]+'px';
  document.getElementById('sheetInfo').textContent=(D.workbooks.length>1?W.label+' · ':'')+sh.name;
  const nts=(D.notes||[]).filter(x=>(x.wb==null||x.wb===W.key)&&(x.sheet==null||x.sheet===sh.name)).map(x=>`<li>${esc(x.text)}</li>`);
  const ul=document.getElementById('notes');ul.innerHTML=nts.join('');ul.style.display=nts.length?'block':'none'}
function render(){const wbs=D.workbooks;
  const wt=document.getElementById('wbTabs');wt.style.display=wbs.length>1?'flex':'none';
  wt.innerHTML=wbs.map((w,i)=>`<button class="wb-btn${i===S.w?' active':''}" onclick="setW(${i})">${esc(w.label)}</button>`).join('');
  document.getElementById('sheetTabs').innerHTML=wbs[S.w].sheets.map((s,i)=>`<button class="sh-btn${i===S.s?' active':''}" onclick="setS(${i})">${esc(s.name)}</button>`).join('');
  renderSheet()}
function setW(i){S.w=i;S.s=D.workbooks[i].start||0;render();document.getElementById('gridWrap').scrollTo(0,0)}
function setS(i){S.s=i;render();document.getElementById('gridWrap').scrollTo(0,0)}
function csv(){const t=document.getElementById('grid');const lines=[...t.querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>'"'+td.innerText.replace(/"/g,'""')+'"').join(','));
  const b=new Blob(['﻿'+lines.join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);
  const W=D.workbooks[S.w];a.download=(D.code+'_'+(D.workbooks.length>1?W.key+'_':'')+W.sheets[S.s].name).replace(/[^A-Za-z0-9_-]+/g,'_')+'.csv';a.click()}
function init(){document.getElementById('title').textContent=D.brand+' — Daily Sales & Marketing Report';
  document.getElementById('subtitle').textContent=D.platforms+' | Data to '+D.data_through+(D.last_updated?' | Last updated: '+D.last_updated:'')+' | Confidential';
  if(D.preview){const pb=document.getElementById('previewBar');pb.style.display='block';pb.innerHTML='<b>PREVIEW — not live, not encrypted.</b> '+esc(D.preview)}
  S.w=0;S.s=D.workbooks[0].start||0;render()}
tryResume();
document.getElementById("pwInput").focus();
</script>
